<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View all</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: black; overflow: hidden; user-select: none; -webkit-user-select: none; }
      #header {
        position: fixed;
        top: 5.5vh;
        left: 5.5vw;
        font-family: "SF Mono", Menlo, "Courier New", monospace;
        font-size: 28px;
        font-weight: bold;
        color: #ffffff;
        z-index: 10;
        pointer-events: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #new-entry {
        position: fixed;
        top: 5.5vh;
        right: 5.5vw;
        font-family: "SF Mono", Menlo, "Courier New", monospace;
        font-size: 28px;
        font-weight: bold;
        color: #ffffff;
        z-index: 10;
        text-decoration: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #scroll-container {
        height: 100vh;
        overflow-y: scroll;
        scrollbar-width: none;
      }
      #scroll-container::-webkit-scrollbar { display: none; }
      #messages { padding-top: 110px; }
      canvas { display: block; }
      @media (max-width: 768px) {
        #header, #new-entry { font-size: 19px; }
        #messages { padding-top: 72px; }
      }
    </style>
    <script src="libraries/p5.min.js"></script>
  </head>
  <body>
    <div id="header">View all</div>
    <a id="new-entry" href="/">New entry</a>
    <div id="scroll-container">
      <div id="messages"></div>
    </div>
    <script type="module" src="output.js"></script>
  </body>
</html>
